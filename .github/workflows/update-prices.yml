# Her ayın ilk haftasında (1-7) fiyat listelerini tarar, değişiklik varsa:
#   1) src/data/monthlyPrices.ts dosyasını günceller ve depoya commit eder,
#   2) (FIREBASE_SERVICE_ACCOUNT secret'ı varsa) güncel araç fiyatlarını Firestore'a yazar.
#      Fiyatı >%2 değişen araçlar için Cloud Function kullanıcılara bildirim gönderir.
# Listeler ayın farklı günlerinde yayınlanabildiği için ilk 7 gün her gün denenir; değişiklik yoksa hiçbir şey yapılmaz.
name: Aylık fiyat güncelleme

on:
  schedule:
    - cron: '0 6 1-7 * *' # 06:00 UTC = 09:00 (Türkiye)
  workflow_dispatch: # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Listeleri tara
        run: node scripts/update-prices.mjs
      - name: Değişiklik var mı?
        id: diff
        run: |
          if git diff --quiet -- src/data/monthlyPrices.ts; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Commit ve push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "evrova-bot"
          git config user.email "evrova-bot@users.noreply.github.com"
          git add src/data/monthlyPrices.ts
          git commit -m "Fiyatlar güncellendi ($(date -u +%Y-%m))"
          git push
      - name: Firestore'a yaz
        if: steps.diff.outputs.changed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "FIREBASE_SERVICE_ACCOUNT secret'ı yok; Firestore güncellenmedi."; exit 0; fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > serviceAccount.json
          node scripts/seed.mjs --vehicles-only
          rm -f serviceAccount.json
